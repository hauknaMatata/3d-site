# Deploys the frontend to GitHub Pages (Settings → Pages → Source: GitHub Actions). By default the page connects to
# the engine on the user's machine (http://localhost:8000). For a hosted engine set repository variable API_URL.
name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build && touch dist/.nojekyll && cp dist/index.html dist/404.html
        env:
          # default: the engine runs on the user's own machine (needed for MCP agents without API keys)
          VITE_API_URL: ${{ vars.API_URL || 'http://localhost:8000' }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
